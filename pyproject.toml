[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "armlens"
version = "0.1.0"
description = "Reproducible LLM inference optimization & benchmarking toolkit for Arm64 servers (KleidiAI / llama.cpp)."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "armlens contributors" }]
keywords = ["arm", "arm64", "aarch64", "graviton", "ampere", "llama.cpp", "kleidiai", "llm", "inference", "benchmark", "quantization"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Operating System :: POSIX :: Linux",
]
dependencies = [
    "rich>=13.0.0",
]

[project.optional-dependencies]
# Plotting is optional so the core tool runs on a bare Arm VM with zero heavy deps.
plots = ["matplotlib>=3.6.0"]

[project.scripts]
armlens = "armlens.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["armlens*"]
