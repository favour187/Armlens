name: ci

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  # Architecture-independent unit tests (parsing + report rendering).
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e . pytest
      - run: python -m pytest tests/ -q
      - run: armlens info   # sanity: CLI runs

  # Real Arm64 smoke: installs, detects Arm features, runs the CLI on an aarch64 runner.
  arm64:
    runs-on: ubuntu-24.04-arm   # GitHub-hosted Arm runner
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e . pytest
      - run: python -m pytest tests/ -q
      - name: Confirm Arm64 detection
        run: |
          armlens info
          python -c "from armlens import sysinfo; assert sysinfo.collect().is_arm64, 'expected Arm64 runner'"
